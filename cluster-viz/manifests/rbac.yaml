apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-viz
  namespace: cluster-viz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viz-reader
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  # Gateway API resources
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-viz-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-viz-reader
subjects:
  - kind: ServiceAccount
    name: cluster-viz
    namespace: cluster-viz
