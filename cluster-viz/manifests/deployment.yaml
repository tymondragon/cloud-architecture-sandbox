apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-viz
  namespace: cluster-viz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-viz
  template:
    metadata:
      labels:
        app: cluster-viz
    spec:
      serviceAccountName: cluster-viz
      containers:
        - name: cluster-viz
          image: cluster-viz:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /api/graph
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/graph
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: EXCLUDE_NAMESPACES
              value: "kube-system,kube-public,kube-node-lease,local-path-storage"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
