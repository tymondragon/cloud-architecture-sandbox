# Kind cluster configuration for cloud-architecture-sandbox
# This creates a local Kubernetes cluster optimized for learning architecture patterns

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloud-architecture-sandbox

# Single control plane node with 2 worker nodes
# This allows testing distributed patterns like load balancing and scatter-gather
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Map localhost:80 to Envoy Gateway for easy access
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # Map localhost:443 for HTTPS
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker node 1
  - role: worker

  # Worker node 2
  - role: worker

# Networking configuration
networking:
  # Disable default CNI - Kind will use kindnet
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"

# Feature gates for advanced Kubernetes features
featureGates:
  # Enable Gateway API (required for Envoy Gateway)
  "GatewayAPI": true
